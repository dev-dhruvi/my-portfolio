name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Base href for web build (e.g. "/<repo-name>/" for GitHub Pages, or "/" for custom domain)'
        required: false
        default: ''

# Grant minimal permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Static Code
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Determine Base Href
        id: base_href
        run: |
          if [ -n "${{ github.event.inputs.base_href }}" ]; then
            echo "href=${{ github.event.inputs.base_href }}" >> $GITHUB_OUTPUT
          else
            echo "href=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          fi

      - name: Build Flutter Web (Release)
        run: |
          flutter build web --release --base-href "${{ steps.base_href.outputs.href }}"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

