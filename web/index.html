<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Dhruvi Patel | Sr. Flutter Developer & Mobile Application Specialist</title>
  <meta name="description" content="Personal developer portfolio of Dhruvi Patel, Senior Flutter Developer specializing in cross-platform mobile apps, Flutter Web, GetX, Firebase, and AWS IoT.">
  <meta name="keywords" content="Dhruvi Patel, Flutter Developer, Mobile App Developer, Dart, Firebase, GetX, Android, iOS, Flutter Web, Portfolio">
  <meta name="author" content="Dhruvi Patel">
  <meta name="theme-color" content="#090D16">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dhruvi Patel | Sr. Flutter Developer">
  <meta property="og:description" content="Senior Software Engineer specializing in Flutter development with 4+ years of experience across mobile and web applications.">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Dhruvi Patel | Sr. Flutter Developer">
  <meta property="twitter:description" content="Senior Software Engineer specializing in Flutter development with 4+ years of experience across mobile and web applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dhruvi Patel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #090D16;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #131D31 0%, #090D16 100%);
      color: #F8FAFC;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8B5CF6;
      border-right-color: #06B6D4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand {
      margin-top: 20px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="brand">DHRUVI PATEL</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
